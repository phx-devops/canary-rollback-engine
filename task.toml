version = "1.0"

[metadata]
author_name = "Andy (Phoenix DevOps)"
difficulty = "hard"
category = "systems"
subcategory = "systems"
tags = ["canary", "progressive-delivery", "nginx", "crash-recovery", "network-namespaces", "observability", "rollback"]
expert_time_estimate_min = 240
junior_time_estimate_min = 900

[verifier]
