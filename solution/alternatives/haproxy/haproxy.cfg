# Ingress for the canary rollout. Weights are changed at runtime over the admin
# socket, so the proxy is never reloaded mid-rollout (counters and connections survive).
global
    stats socket /run/canary/haproxy.sock mode 600 level admin
    # Access log goes to the engine's unix datagram socket (no syslog daemon needed).
    log /run/canary/log.sock len 1024 local0 info

defaults
    mode http
    log global
    timeout connect 1s
    timeout client 30s
    # A target that does not answer within 5 s counts as failed (instruction).
    timeout server 5s
    # No redispatch: a failed attempt on app-green is never silently retried on blue,
    # so every green failure shows up in the log attributed to app-green.
    retries 0

frontend ingress
    bind 127.0.0.1:8080
    log-format "CANARY %s %ST %tsc"
    default_backend apps

backend apps
    balance roundrobin
    server app-blue  127.0.0.1:9001 weight 100
    server app-green 127.0.0.1:9002 weight 0
